<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pip's Snack Sort</title>
<style>
  :root{--bg:#f2a65a;--card:#fff6e6;--ink:#3b2a1a;--soft:#6b5640;--lcd:#b9c9a0;--lcd-ink:#2f3a24}
  @media (prefers-color-scheme:dark){:root{--bg:#2a2016;--card:#3a2c1e;--ink:#f6ead8;--soft:#d6c3a8;--lcd:#56664a;--lcd-ink:#e6efd6}}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:720px;margin:24px auto;padding:24px 20px;background:var(--card);border-radius:18px}
  @media (max-width:760px){main{margin:16px;padding:20px 16px}}
  h1{font-size:1.6rem;margin:.2em 0}
  h2{font-size:1.15rem;margin:1.6em 0 .4em}
  p,li{max-width:65ch}
  .lede{background:var(--lcd);color:var(--lcd-ink);padding:12px 14px;border-radius:12px}
  .small{color:var(--soft);font-size:.9rem}
  a{color:inherit}
  table{border-collapse:collapse;width:100%;font-size:.95rem}
  th,td{text-align:left;vertical-align:top;padding:8px 6px;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}
</style>
</head>
<body>
<main>
<h1>Pip's Snack Sort</h1>
<p class="lede">A snack-sorting puzzle starring Pip, from the makers of Pocket Pip. No ads, nothing to buy inside.</p>
<p><a href="help.html">Help</a> · <a href="privacy.html">Privacy policy</a> · <a href="../">Pocket Pip</a></p>
</main>
</body>
</html>
