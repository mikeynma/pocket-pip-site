<!doctype html>
<html lang="en-GB">
<head>

<title>Pocket Pip</title>
<style>
  :root{--bg:#f2a65a;--card:#fff6e6;--ink:#3b2a1a;--soft:#6b5640}

  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:560px;margin:24px auto;padding:24px 20px;background:var(--card);border-radius:18px;text-align:center}
  @media (max-width:600px){main{margin:16px;padding:20px 16px}}
  img{width:96px;height:96px;border-radius:22px;image-rendering:pixelated}
  h1{margin:.3em 0}
  p{color:var(--soft)}
  a{color:inherit}
</style>

<main>
